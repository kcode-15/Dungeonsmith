openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tabletop
    description: Rooms, maps, players, chat, and combat
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dm/rooms:
    get:
      operationId: listDmRooms
      tags: [tabletop]
      summary: List the signed-in DM's rooms
      responses:
        "200":
          description: Rooms owned by the signed-in DM
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomSummary"
        "401":
          description: Authentication required
    post:
      operationId: createRoom
      tags: [tabletop]
      summary: Create a room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "201":
          description: The new room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSummary"
        "400":
          description: Invalid room details
        "401":
          description: Authentication required
  /rooms/{code}:
    get:
      operationId: getRoomByCode
      tags: [tabletop]
      summary: Get a room by its join code
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The room and its current map and players
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomState"
        "404":
          description: Room not found
  /rooms/{code}/join:
    post:
      operationId: joinRoom
      tags: [tabletop]
      summary: Join a room with a character name
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRoomInput"
      responses:
        "201":
          description: The joined player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          description: Invalid character name
        "404":
          description: Room not found
  /rooms/{code}/map:
    put:
      operationId: updateRoomMap
      tags: [tabletop]
      summary: Save the room map
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapInput"
      responses:
        "200":
          description: The saved map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapData"
        "401":
          description: Authentication required
        "403":
          description: Only the room DM can edit its map
        "404":
          description: Room not found
  /rooms/{code}/combat:
    get:
      operationId: getRoomCombat
      tags: [tabletop]
      summary: Get room combat state
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current combat state and recent attack rolls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CombatState"
        "401":
          description: Join the room to view combat
        "404":
          description: Room not found
    post:
      operationId: updateRoomCombat
      tags: [tabletop]
      summary: Start, advance, or end combat
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CombatActionInput"
      responses:
        "200":
          description: Updated combat state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CombatState"
        "400":
          description: Invalid combat action
        "401":
          description: Authentication required
        "403":
          description: Only the room DM can control combat
        "404":
          description: Room not found
        "409":
          description: Combat cannot perform that action right now
  /rooms/{code}/combatants:
    post:
      operationId: addCombatant
      tags: [tabletop]
      summary: Add an enemy to combat
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CombatantInput"
      responses:
        "201":
          description: Updated combat state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CombatState"
        "400":
          description: Invalid enemy details
        "401":
          description: Authentication required
        "403":
          description: Only the room DM can add enemies
        "404":
          description: Room not found
  /rooms/{code}/combatants/{combatantId}:
    patch:
      operationId: updateCombatantInitiative
      tags: [tabletop]
      summary: Update a combatant's initiative
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
        - in: path
          name: combatantId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CombatantInitiativeInput"
      responses:
        "200":
          description: Updated combat state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CombatState"
        "400":
          description: Invalid initiative
        "401":
          description: Authentication required
        "403":
          description: Only the room DM can edit initiative
        "404":
          description: Room or combatant not found
    delete:
      operationId: removeCombatant
      tags: [tabletop]
      summary: Remove a combatant
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
        - in: path
          name: combatantId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated combat state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CombatState"
        "401":
          description: Authentication required
        "403":
          description: Only the room DM can remove combatants
        "404":
          description: Room or combatant not found
  /rooms/{code}/combat/attacks:
    post:
      operationId: requestAttack
      tags: [tabletop]
      summary: Request an attack roll on the active player's turn
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttackRequestInput"
      responses:
        "201":
          description: The server-rolled attack result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttackResult"
        "400":
          description: Invalid attack details
        "401":
          description: Join the room to request an attack
        "403":
          description: It is not this player's turn
        "404":
          description: Room not found
        "409":
          description: Combat is not active
  /rooms/{code}/messages:
    get:
      operationId: listRoomMessages
      tags: [tabletop]
      summary: List room chat messages
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The latest chat messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
        "401":
          description: Join the room to view chat
        "404":
          description: Room not found
    post:
      operationId: sendRoomMessage
      tags: [tabletop]
      summary: Send a chat message
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: The new chat message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Invalid message
        "401":
          description: Join the room to chat
        "404":
          description: Room not found
  /rooms/{code}/voice/join:
    post:
      operationId: joinRoomVoice
      tags: [tabletop]
      summary: Join a room's live voice chat
      description: Creates temporary presence for a signed-in DM or a joined player. No audio is sent to the API.
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        "201":
          description: The voice participant and current room roster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceJoinResponse"
        "401":
          description: Join the room before entering voice
        "404":
          description: Room not found
        "409":
          description: Voice room is full
  /rooms/{code}/voice/participants/{participantId}/state:
    get:
      operationId: getRoomVoiceState
      tags: [tabletop]
      summary: Poll live voice presence and connection signals
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
        - in: path
          name: participantId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current temporary voice state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceRoomState"
        "401":
          description: Join the room before entering voice
        "403":
          description: This voice session belongs to another room member
        "404":
          description: Room or voice session not found
  /rooms/{code}/voice/participants/{participantId}/signals:
    post:
      operationId: sendRoomVoiceSignal
      tags: [tabletop]
      summary: Send temporary WebRTC connection details
      description: Accepts SDP or ICE signaling metadata only; audio media is never accepted.
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
        - in: path
          name: participantId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceSignalInput"
      responses:
        "202":
          description: Signal queued briefly for the other participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceSignal"
        "400":
          description: Invalid connection signal
        "401":
          description: Join the room before entering voice
        "403":
          description: This voice session belongs to another room member
        "404":
          description: Room or recipient voice session not found
        "429":
          description: Too many pending signals
  /rooms/{code}/voice/participants/{participantId}:
    delete:
      operationId: leaveRoomVoice
      tags: [tabletop]
      summary: Leave live voice chat
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
        - in: path
          name: participantId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Voice presence and pending signals removed
        "401":
          description: Join the room before entering voice
        "403":
          description: This voice session belongs to another room member
        "404":
          description: Room or voice session not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    VoiceParticipant:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        kind:
          type: string
          enum: [dm, player]
        joinedAt:
          type: string
          format: date-time
      required: [id, displayName, kind, joinedAt]
    VoiceSignalPayload:
      type: object
      properties:
        sdp:
          type: string
          maxLength: 24000
        candidate:
          type: string
          maxLength: 4096
        sdpMid:
          type: ["string", "null"]
          maxLength: 256
        sdpMLineIndex:
          type: ["integer", "null"]
          minimum: 0
        usernameFragment:
          type: ["string", "null"]
          maxLength: 256
      additionalProperties: false
    VoiceSignal:
      type: object
      properties:
        id:
          type: string
        fromParticipantId:
          type: string
        type:
          type: string
          enum: [offer, answer, ice-candidate]
        payload:
          $ref: "#/components/schemas/VoiceSignalPayload"
        createdAt:
          type: string
          format: date-time
      required: [id, fromParticipantId, type, payload, createdAt]
    VoiceSignalInput:
      type: object
      properties:
        toParticipantId:
          type: string
          minLength: 1
          maxLength: 64
        type:
          type: string
          enum: [offer, answer, ice-candidate]
        payload:
          $ref: "#/components/schemas/VoiceSignalPayload"
      required: [toParticipantId, type, payload]
      additionalProperties: false
    VoiceJoinResponse:
      type: object
      properties:
        participantId:
          type: string
        participant:
          $ref: "#/components/schemas/VoiceParticipant"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/VoiceParticipant"
      required: [participantId, participant, participants]
    VoiceRoomState:
      type: object
      properties:
        participantId:
          type: string
        participants:
          type: array
          items:
            $ref: "#/components/schemas/VoiceParticipant"
        signals:
          type: array
          items:
            $ref: "#/components/schemas/VoiceSignal"
      required: [participantId, participants, signals]
    Terrain:
      type: string
      enum: [grass, stone, water, forest, sand, lava, wall]
    MapData:
      type: object
      properties:
        width:
          type: integer
          minimum: 8
          maximum: 32
        height:
          type: integer
          minimum: 8
          maximum: 24
        tiles:
          type: array
          items:
            $ref: "#/components/schemas/Terrain"
      required: [width, height, tiles]
    MapInput:
      type: object
      properties:
        map:
          $ref: "#/components/schemas/MapData"
      required: [map]
    Combatant:
      type: object
      properties:
        id:
          type: string
        playerId:
          type: ["string", "null"]
        name:
          type: string
        kind:
          type: string
          enum: [player, enemy]
        initiative:
          type: integer
      required: [id, playerId, name, kind, initiative]
    AttackResult:
      type: object
      properties:
        id:
          type: string
        actorId:
          type: string
        actorName:
          type: string
        targetName:
          type: string
        dexterityScore:
          type: integer
        dexterityModifier:
          type: integer
        d20Roll:
          type: integer
        total:
          type: integer
        round:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, actorId, actorName, targetName, dexterityScore, dexterityModifier, d20Roll, total, round, createdAt]
    CombatState:
      type: object
      properties:
        active:
          type: boolean
        round:
          type: integer
        activeCombatantId:
          type: ["string", "null"]
        combatants:
          type: array
          items:
            $ref: "#/components/schemas/Combatant"
        attacks:
          type: array
          items:
            $ref: "#/components/schemas/AttackResult"
      required: [active, round, activeCombatantId, combatants, attacks]
    CombatActionInput:
      type: object
      properties:
        action:
          type: string
          enum: [start, advance, end]
      required: [action]
    CombatantInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        initiative:
          type: integer
          minimum: -5
          maximum: 50
      required: [name, initiative]
    CombatantInitiativeInput:
      type: object
      properties:
        initiative:
          type: integer
          minimum: -5
          maximum: 50
      required: [initiative]
    AttackRequestInput:
      type: object
      properties:
        targetName:
          type: string
          minLength: 1
          maxLength: 60
        dexterityScore:
          type: integer
          minimum: 1
          maximum: 30
      required: [targetName, dexterityScore]
    RoomInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
      required: [title]
    JoinRoomInput:
      type: object
      properties:
        characterName:
          type: string
          minLength: 1
          maxLength: 40
      required: [characterName]
    ChatMessageInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 500
      required: [content]
    Player:
      type: object
      properties:
        id:
          type: string
        characterName:
          type: string
        joinedAt:
          type: string
          format: date-time
      required: [id, characterName, joinedAt]
    ChatMessage:
      type: object
      properties:
        id:
          type: string
        characterName:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, characterName, content, createdAt]
    RoomSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        code:
          type: string
        playerCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, title, code, playerCount, createdAt]
    RoomState:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        code:
          type: string
        map:
          $ref: "#/components/schemas/MapData"
        players:
          type: array
          items:
            $ref: "#/components/schemas/Player"
        createdAt:
          type: string
          format: date-time
      required: [id, title, code, map, players, createdAt]

